name: IPTV Channel Manager

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    paths:
      - 'myq.txt'

jobs:
  organize:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 添加写权限
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 使用内置 token
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run IPTV Manager
        run: |
          python3 py/iptv_manager.py myq.txt
      
      - name: List output
        run: |
          ls -la output/
          cat output/索引_*.txt
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: IPTV分类结果
          path: output/
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Update IPTV channel classification [skip ci]" || echo "No changes"
          git push
